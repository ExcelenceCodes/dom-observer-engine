<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DVE Fixture 3 — Dynamic Application</title>
<style>
  :root { --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --brand:#b45309; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; color:var(--ink); background:#fffbf5; }
  main { max-width:880px; margin:0 auto; padding:24px 20px 120px; }
  button { font:inherit; padding:8px 13px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0; }
  ul#items { list-style:none; padding:0; display:grid; gap:8px; }
  ul#items li { background:#fff; border:1px solid var(--line); border-radius:9px; padding:10px 12px; display:flex; align-items:center; gap:10px; }
  .skeleton { height:42px; border-radius:9px; background:linear-gradient(90deg,#f3f4f6,#e5e7eb,#f3f4f6); background-size:200% 100%; animation:sk 1.1s infinite; }
  @keyframes sk { to { background-position:-200% 0; } }
  #toasts { position:fixed; right:16px; bottom:16px; display:grid; gap:8px; z-index:60; }
  .toast { background:#111827; color:#fff; padding:10px 14px; border-radius:9px; min-width:220px; box-shadow:0 8px 20px rgba(0,0,0,.2); }
  dialog { border:1px solid var(--line); border-radius:12px; padding:0; width:min(460px,92vw); }
  dialog::backdrop { background:rgba(17,24,39,.45); }
  .dlg-body { padding:18px; }
  .dlg-foot { display:flex; justify-content:flex-end; gap:8px; padding:12px 18px; border-top:1px solid var(--line); }
  input { padding:8px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  .banner { background:#fef3c7; border:1px solid #fcd34d; border-radius:9px; padding:10px 12px; margin-bottom:14px; }
</style>
</head>
<body>
<main>
  <h1>Task stream</h1>
  <div class="banner" role="status" id="banner">Live workspace — content changes without navigation.</div>

  <div class="bar">
    <button class="primary" id="add-task">Add task</button>
    <button id="load-batch">Load batch (async)</button>
    <button id="clear-tasks">Clear all</button>
    <button id="notify">Show toast</button>
    <button id="open-dialog">Open confirm dialog</button>
    <button id="toggle-panel" aria-expanded="false" aria-controls="side-panel">Toggle panel</button>
  </div>

  <section id="side-panel" hidden aria-label="Details panel" style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px">
    <h2 style="margin-top:0;font-size:15px">Panel</h2>
    <label for="panel-input">Filter tasks</label>
    <input id="panel-input" placeholder="type to filter" />
    <button id="panel-apply">Apply</button>
  </section>

  <div id="loading" hidden><div class="skeleton"></div><div class="skeleton" style="margin-top:8px"></div></div>
  <ul id="items"></ul>
</main>

<div id="toasts" aria-live="polite"></div>

<dialog id="confirm">
  <div class="dlg-body">
    <h2 id="confirm-title" style="margin-top:0">Delete all tasks?</h2>
    <p>This is a modal dialog with its own focus trap and interactive controls.</p>
    <label for="confirm-word">Type DELETE to confirm</label>
    <input id="confirm-word" />
  </div>
  <div class="dlg-foot">
    <button id="confirm-cancel">Cancel</button>
    <button class="primary" id="confirm-ok">Confirm</button>
  </div>
</dialog>

<script>
  var seq = 0;
  var list = document.getElementById('items');

  function addTask(label) {
    seq++;
    var li = document.createElement('li');
    li.id = 'task-' + seq;
    var cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'done-' + seq;
    var span = document.createElement('span'); span.textContent = label || ('Task #' + seq); span.style.flex = '1';
    var btn = document.createElement('button'); btn.textContent = 'Remove'; btn.id = 'rm-' + seq;
    btn.addEventListener('click', function () { li.remove(); toast('Task removed'); });
    li.appendChild(cb); li.appendChild(span); li.appendChild(btn);
    list.appendChild(li);
  }

  function toast(message) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.setAttribute('data-toast', '');
    t.setAttribute('role', 'status');
    t.textContent = message;
    document.getElementById('toasts').appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  }

  document.getElementById('add-task').addEventListener('click', function () { addTask(); toast('Task added'); });
  document.getElementById('notify').addEventListener('click', function () { toast('Notification at ' + new Date().toLocaleTimeString()); });
  document.getElementById('clear-tasks').addEventListener('click', function () { list.innerHTML = ''; toast('Cleared'); });

  document.getElementById('load-batch').addEventListener('click', function () {
    var loading = document.getElementById('loading');
    loading.hidden = false;
    setTimeout(function () {
      loading.hidden = true;
      ['Reconcile ledger','Verify shipment','Approve invoice','Archive report'].forEach(addTask);
      toast('Batch loaded');
    }, 700);
  });

  var dlg = document.getElementById('confirm');
  document.getElementById('open-dialog').addEventListener('click', function () { dlg.showModal(); });
  document.getElementById('confirm-cancel').addEventListener('click', function () { dlg.close(); });
  document.getElementById('confirm-ok').addEventListener('click', function () {
    if (document.getElementById('confirm-word').value === 'DELETE') { list.innerHTML = ''; toast('All tasks deleted'); }
    else { toast('Confirmation text did not match'); }
    dlg.close();
  });

  document.getElementById('toggle-panel').addEventListener('click', function () {
    var p = document.getElementById('side-panel');
    var open = this.getAttribute('aria-expanded') === 'true';
    this.setAttribute('aria-expanded', String(!open));
    p.hidden = open;
  });

  addTask('Review onboarding');
  addTask('Ship release notes');
</script>
</body>
</html>
